name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"   # every Monday 05:00 UTC: refresh publications from ORCID
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh publications from ORCID
        run: python scripts/fetch_orcid.py
      - name: Refresh GitHub star counts
        run: python scripts/fetch_github.py
      - name: Commit updated publication data
        run: |
          if ! git diff --quiet data/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update publications and project data"
            git push
          fi
      - name: Build site
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
